# SPDX-License-Identifier: MPL-2.0
name: K9-SVC Validation

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Validate contractiles
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          for file in Must Trust Dust Lust Adjust Intend; do
            if [ ! -f "${file}.a2ml" ]; then
              echo "ERROR: Missing contractile: ${file}.a2ml"
              exit 1
            fi
          done

          echo "OK: all contractiles present"

          for file in *.a2ml; do
            if [ -f "$file" ]; then
              if ! grep -q "^// SPDX-License-Identifier:" "$file"; then
                echo "ERROR: Missing SPDX header in $file"
                exit 1
              fi
            fi
          done

          echo "OK: contractile validation passed"
